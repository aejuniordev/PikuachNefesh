name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir versão
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O padrão "tools platform-tools" falha: o pacote legado "tools" não existe mais
          packages: platform-tools

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK e AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease assembleDebug \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ github.run_number }}"

      - name: Organizar artefatos
        run: |
          mkdir -p dist
          V="${{ steps.version.outputs.name }}"
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *unsigned*) cp "$f" "dist/PikuachNefesh-$V-release-unsigned.apk" ;;
              *)          cp "$f" "dist/PikuachNefesh-$V-release.apk" ;;
            esac
          done
          cp app/build/outputs/apk/debug/*.apk "dist/PikuachNefesh-$V-debug.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/PikuachNefesh-$V-release.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Pikuach Nefesh ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
